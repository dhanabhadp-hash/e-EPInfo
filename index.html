<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามข้อมูล e-GP</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EGP Track">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

  <!-- Header Bar -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
          <i data-lucide="file-text" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">e-GP Information Tracking</h1>
          <p class="text-xs text-gray-400">ระบบติดตามสถานะพัสดุและการตรวจรับ</p>
        </div>
      </div>

      <!-- Search Bar & Refresh Controls -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <!-- Global Search Input (Ctrl+F Style) -->
        <div class="relative flex-grow md:w-72">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input 
            type="text" 
            id="search-input" 
            oninput="handleSearch(event)"
            placeholder="ค้นหาข้อมูลทั้งหมด (เช่น PO, รายละเอียด...)" 
            class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-9 pr-4 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition shadow-inner"
          >
        </div>

        <!-- Refresh Button -->
        <button 
          id="refresh-btn" 
          onclick="fetchSheetData()"
          class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-blue-900/30 active:scale-95 disabled:opacity-50 flex-shrink-0"
        >
          <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i>
          <span id="refresh-text">รีเฟรช</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <div id="master-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Dynamic Cards -->
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="p-5 border-b border-gray-800 flex justify-between items-start bg-gray-900/80">
        <div>
          <span id="modal-po" class="text-xs font-mono font-semibold text-blue-400 bg-blue-950/80 px-2.5 py-1 rounded-md border border-blue-800/50"></span>
          <h3 id="modal-project" class="text-base font-semibold text-white mt-2 leading-relaxed"></h3>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 transition">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div id="modal-body" class="p-5 overflow-y-auto space-y-4 flex-grow">
        <!-- Sub-cards -->
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-gray-800 bg-gray-900/50 flex justify-end">
        <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm px-5 py-2 rounded-xl transition">
          ปิดหน้าต่าง
        </button>
      </div>

    </div>
  </div>

  <!-- Main Script with Cache Busting -->
  <script src="app.js?v=3.2"></script>
</body>
</html>
